name: Update profile README

on:
  schedule:
    # 6時間ごと(UTC)。GitHub Actions の cron は UTC 基準。
    - cron: "0 */6 * * *"
  workflow_dispatch: {}          # 手動実行ボタンを有効化
  push:
    branches: [main]             # README/スクリプト更新時にもすぐ反映

permissions:
  contents: write                # README をコミットするために必要

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dynamic sections
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh dynamic README sections"
          git push
